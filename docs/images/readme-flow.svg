<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520" role="img" aria-labelledby="title desc">
  <title id="title">How the Question Bank paper workflow works</title>
  <desc id="desc">Four stages: choose questions, set the assessment structure, prepare with local retrieval and logic, then review and save the paper.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1f7fa"/><stop offset="1" stop-color="#fff7eb"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#e5f2f9"/><stop offset="1" stop-color="#f5fafc"/></linearGradient><linearGradient id="warm" x2="1" y2="1"><stop stop-color="#fff5e4"/><stop offset="1" stop-color="#fffaf2"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#30566d" flood-opacity=".08"/></filter></defs>
  <rect width="1800" height="520" rx="28" fill="url(#bg)"/><text x="62" y="67" font-family="Segoe UI,Arial" font-size="14" font-weight="700" letter-spacing="2.4" fill="#557b92">THE WORKFLOW</text><text x="62" y="112" font-family="Georgia,serif" font-size="34" fill="#1c4158">A clear path from source material to a saved assessment</text>
  <g font-family="Segoe UI,Arial" filter="url(#shadow)">
    <rect x="60" y="152" width="382" height="290" rx="22" fill="#fff" stroke="#dce7ed"/><circle cx="106" cy="202" r="23" fill="#e3f1f8"/><text x="98" y="208" font-size="14" font-weight="700" fill="#2e7194">01</text><text x="144" y="207" font-size="12" font-weight="700" letter-spacing="1.6" fill="#527a92">CHOOSE A SOURCE</text><text x="91" y="260" font-family="Georgia,serif" font-size="24" fill="#1d425a">Start with what you have</text>
    <rect x="91" y="286" width="320" height="39" rx="10" fill="url(#blue)" stroke="#dbe8ee"/><circle cx="112" cy="305" r="7" fill="#568aa5"/><text x="131" y="310" font-size="13" fill="#365d74">Pick questions yourself</text><rect x="91" y="334" width="320" height="39" rx="10" fill="#f3f8f5" stroke="#dce9e1"/><circle cx="112" cy="353" r="7" fill="#6c9b7d"/><text x="131" y="358" font-size="13" fill="#365d74">Select from your question bank</text><rect x="91" y="382" width="320" height="39" rx="10" fill="url(#warm)" stroke="#eee2cb"/><circle cx="112" cy="401" r="7" fill="#c09a59"/><text x="131" y="406" font-size="13" fill="#365d74">Upload a syllabus</text>
    <path d="M455 297h34m-11-11 11 11-11 11" fill="none" stroke="#86a9ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="501" y="152" width="382" height="290" rx="22" fill="#fff" stroke="#dce7ed"/><circle cx="547" cy="202" r="23" fill="#edf4fa"/><text x="539" y="208" font-size="14" font-weight="700" fill="#557996">02</text><text x="585" y="207" font-size="12" font-weight="700" letter-spacing="1.6" fill="#527a92">SHAPE THE ASSESSMENT</text><text x="532" y="260" font-family="Georgia,serif" font-size="24" fill="#1d425a">Set the structure</text>
    <rect x="532" y="286" width="320" height="56" rx="11" fill="url(#blue)" stroke="#dbe8ee"/><text x="550" y="309" font-size="11" font-weight="700" fill="#45758e">QUESTION MARKS</text><text x="550" y="329" font-size="13" fill="#365d74">1 · 2 · 5 · 10 · 16</text><rect x="532" y="353" width="320" height="68" rx="11" fill="url(#warm)" stroke="#eee2cb"/><text x="550" y="376" font-size="11" font-weight="700" fill="#8a7149">BLOOM LEVELS</text><g font-size="11" font-weight="700" text-anchor="middle"><circle cx="565" cy="400" r="13" fill="#dcecf4"/><text x="565" y="404" fill="#336d8d">K1</text><circle cx="609" cy="400" r="13" fill="#e1eee8"/><text x="609" y="404" fill="#4a7d62">K2</text><circle cx="653" cy="400" r="13" fill="#f4ead4"/><text x="653" y="404" fill="#92753d">K3</text><circle cx="697" cy="400" r="13" fill="#f3e5dd"/><text x="697" y="404" fill="#9c6852">K4</text><circle cx="741" cy="400" r="13" fill="#eee5f0"/><text x="741" y="404" fill="#795d82">K5</text><circle cx="785" cy="400" r="13" fill="#e7e9f4"/><text x="785" y="404" fill="#5b658e">K6</text></g>
    <path d="M896 297h34m-11-11 11 11-11 11" fill="none" stroke="#86a9ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="942" y="152" width="382" height="290" rx="22" fill="#fff" stroke="#dce7ed"/><circle cx="988" cy="202" r="23" fill="#f7efdf"/><text x="980" y="208" font-size="14" font-weight="700" fill="#987541">03</text><text x="1026" y="207" font-size="12" font-weight="700" letter-spacing="1.4" fill="#527a92">BUILD LOCALLY</text><text x="973" y="260" font-family="Georgia,serif" font-size="24" fill="#1d425a">Ground each question</text>
    <rect x="973" y="286" width="320" height="41" rx="10" fill="url(#blue)" stroke="#dbe8ee"/><text x="993" y="312" font-size="13" fill="#365d74">BM25 finds related syllabus passages</text><rect x="973" y="337" width="320" height="41" rx="10" fill="#f3f8f5" stroke="#dce9e1"/><text x="993" y="363" font-size="13" fill="#365d74">Local rules and ML shape candidates</text><rect x="973" y="388" width="320" height="33" rx="10" fill="url(#warm)" stroke="#eee2cb"/><text x="993" y="410" font-size="12" fill="#735f3d">No hosted AI call is required</text>
    <path d="M1337 297h34m-11-11 11 11-11 11" fill="none" stroke="#86a9ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1383" y="152" width="357" height="290" rx="22" fill="#fff" stroke="#dce7ed"/><circle cx="1429" cy="202" r="23" fill="#e8f1e9"/><text x="1421" y="208" font-size="14" font-weight="700" fill="#547d61">04</text><text x="1467" y="207" font-size="12" font-weight="700" letter-spacing="1.4" fill="#527a92">REVIEW &amp; KEEP</text><text x="1414" y="260" font-family="Georgia,serif" font-size="24" fill="#1d425a">Make it yours</text>
    <rect x="1414" y="286" width="295" height="135" rx="13" fill="url(#warm)" stroke="#e7ddc9"/><rect x="1441" y="305" width="241" height="98" rx="8" fill="#fff" stroke="#e2e8e7"/><text x="1460" y="329" font-size="9" font-weight="700" letter-spacing="1" fill="#9a7a48">EXAMINATION PAPER</text><path d="M1460 341h200" stroke="#dce4e7"/><text x="1460" y="362" font-size="10" fill="#456578">Section A · 2 marks</text><rect x="1652" y="350" width="25" height="17" rx="8" fill="#e7f2f7"/><text x="1658" y="362" font-size="8" font-weight="700" fill="#337291">K2</text><text x="1460" y="385" font-size="10" fill="#456578">Export PDF · save · retrieve</text>
  </g>
  <text x="62" y="484" font-family="Segoe UI,Arial" font-size="12" fill="#728797">Each stage stays visible, editable and traceable from the first source through the final saved paper.</text>
</svg>
