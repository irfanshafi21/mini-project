<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="790" viewBox="0 0 1800 790" role="img" aria-labelledby="title desc">
  <title id="title">Local syllabus question-generation pipeline</title><desc id="desc">Syllabus text is extracted, split into units and topics, BM25 retrieves relevant passages, trained classifiers rank topics and Bloom tasks, local templates create candidates, and validation checks constraints before a paper is saved.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f6f9"/><stop offset="1" stop-color="#fff6e9"/></linearGradient><linearGradient id="sky" x2="1" y2="1"><stop stop-color="#e5f2f9"/><stop offset="1" stop-color="#f7fbfd"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff3df"/><stop offset="1" stop-color="#fffaf1"/></linearGradient><linearGradient id="green" x2="1" y2="1"><stop stop-color="#eaf3ed"/><stop offset="1" stop-color="#f8fbf8"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#30566d" flood-opacity=".09"/></filter></defs>
  <rect width="1800" height="790" rx="30" fill="url(#bg)"/><text x="62" y="72" font-family="Segoe UI,Arial" font-size="14" font-weight="700" letter-spacing="2.4" fill="#557b92">LOCAL GENERATION · NO HOSTED AI KEY</text><text x="62" y="121" font-family="Georgia,serif" font-size="35" fill="#1c4158">Retrieval grounds each question; local rules shape its wording</text>
  <g font-family="Segoe UI,Arial" filter="url(#shadow)">
    <rect x="62" y="169" width="364" height="183" rx="21" fill="#fff" stroke="#dce7ed"/><circle cx="106" cy="213" r="21" fill="#e7f2f8"/><text x="99" y="219" font-size="13" font-weight="700" fill="#337494">01</text><text x="145" y="217" fill="#527a92" font-size="11" font-weight="700" letter-spacing="1.4">UPLOAD &amp; EXTRACT</text><text x="89" y="267" fill="#1d425a" font-family="Georgia,serif" font-size="24">Read syllabus text</text><text x="89" y="298" fill="#506b7d" font-size="14">PDF/TXT → text → unit chunks</text><text x="89" y="326" fill="#748895" font-size="12">Scanned PDFs need OCR before upload.</text>
    <path d="M439 260h44m-12-12 12 12-12 12" fill="none" stroke="#84a7b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="497" y="169" width="364" height="183" rx="21" fill="url(#sky)" stroke="#d5e5ed"/><circle cx="541" cy="213" r="21" fill="#d5eaf5"/><text x="534" y="219" font-size="13" font-weight="700" fill="#337494">02</text><text x="580" y="217" fill="#527a92" font-size="11" font-weight="700" letter-spacing="1.4">SELECT THE EVIDENCE</text><text x="524" y="267" fill="#1d425a" font-family="Georgia,serif" font-size="24">Filter units and topics</text><text x="524" y="298" fill="#506b7d" font-size="14">Keep only the requested units.</text><text x="524" y="326" fill="#748895" font-size="12">Each candidate keeps its syllabus passage.</text>
    <path d="M874 260h44m-12-12 12 12-12 12" fill="none" stroke="#84a7b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="932" y="169" width="364" height="183" rx="21" fill="url(#gold)" stroke="#eadfc9"/><circle cx="976" cy="213" r="21" fill="#f5e9d2"/><text x="969" y="219" font-size="13" font-weight="700" fill="#987541">03</text><text x="1015" y="217" fill="#8b714a" font-size="11" font-weight="700" letter-spacing="1.4">RETRIEVE LOCALLY</text><text x="959" y="267" fill="#1d425a" font-family="Georgia,serif" font-size="24">Rank with BM25</text><text x="959" y="298" fill="#506b7d" font-size="14">Find passages matching each topic.</text><text x="959" y="326" fill="#748895" font-size="12">Token statistics · no vector model download.</text>
    <path d="M1309 260h44m-12-12 12 12-12 12" fill="none" stroke="#84a7b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1367" y="169" width="364" height="183" rx="21" fill="url(#green)" stroke="#d9e7de"/><circle cx="1411" cy="213" r="21" fill="#dcece1"/><text x="1404" y="219" font-size="13" font-weight="700" fill="#4f7d5e">04</text><text x="1450" y="217" fill="#527a92" font-size="11" font-weight="700" letter-spacing="1.4">CLASSIFY THE TASK</text><text x="1394" y="267" fill="#1d425a" font-family="Georgia,serif" font-size="24">Rank topics and K levels</text><text x="1394" y="298" fill="#506b7d" font-size="14">Local Naive Bayes classifies features.</text><text x="1394" y="326" fill="#748895" font-size="12">Task grammars express the requested Bloom level.</text>
  </g>
  <path d="M1549 374v59H255v-47m-10 10 10-10 10 10" fill="none" stroke="#9bb6c1" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round" stroke-linejoin="round"/><rect x="641" y="411" width="520" height="43" rx="21" fill="#fff" stroke="#dce7ed"/><text x="688" y="438" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#547589">Only the selected syllabus units flow into the next stage</text>
  <g font-family="Segoe UI,Arial" filter="url(#shadow)">
    <rect x="254" y="484" width="520" height="198" rx="22" fill="#fff" stroke="#dce7ed"/><circle cx="300" cy="529" r="21" fill="#e8edf5"/><text x="293" y="535" font-size="13" font-weight="700" fill="#5d688c">05</text><text x="339" y="533" fill="#527a92" font-size="11" font-weight="700" letter-spacing="1.4">FORM GROUNDED QUESTIONS</text><text x="287" y="583" fill="#1d425a" font-family="Georgia,serif" font-size="24">Controlled local generator</text><text x="287" y="614" fill="#506b7d" font-size="14">Combines the retrieved passage with authored</text><text x="287" y="638" fill="#506b7d" font-size="14">question patterns for marks and cognitive demand.</text><rect x="287" y="653" width="160" height="20" rx="10" fill="#f2f6f8"/><text x="302" y="667" fill="#5c7a8c" font-size="10" font-weight="700">NOT AN OPEN-ENDED LLM</text>
    <path d="M790 582h63m-13-13 13 13-13 13" fill="none" stroke="#84a7b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="864" y="484" width="520" height="198" rx="22" fill="#fff" stroke="#dce7ed"/><circle cx="910" cy="529" r="21" fill="#f3ead9"/><text x="903" y="535" font-size="13" font-weight="700" fill="#977644">06</text><text x="949" y="533" fill="#527a92" font-size="11" font-weight="700" letter-spacing="1.4">VALIDATE &amp; ASSEMBLE</text><text x="897" y="583" fill="#1d425a" font-family="Georgia,serif" font-size="24">Check every constraint</text><text x="897" y="614" fill="#506b7d" font-size="14">Marks · question count · unit evidence · Bloom</text><text x="897" y="638" fill="#506b7d" font-size="14">Duplicate budget · objective answer checks</text><rect x="897" y="653" width="212" height="20" rx="10" fill="#edf5ef"/><text x="912" y="667" fill="#52765a" font-size="10" font-weight="700">SHORTFALLS ARE REPORTED</text>
    <path d="M1400 582h63m-13-13 13 13-13 13" fill="none" stroke="#84a7b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1474" y="484" width="257" height="198" rx="22" fill="#eaf3ed" stroke="#d9e7de"/><circle cx="1518" cy="529" r="21" fill="#d6e8db"/><path d="m1509 529 6 6 12-13" fill="none" stroke="#4c7b5b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1556" y="533" fill="#527a92" font-size="11" font-weight="700" letter-spacing="1.2">READY TO REVIEW</text><text x="1500" y="583" fill="#1d425a" font-family="Georgia,serif" font-size="22">Paper draft</text><path d="M1500 602h202M1500 620h178M1500 638h194" stroke="#b9cfc0" stroke-width="5" stroke-linecap="round"/><rect x="1500" y="650" width="84" height="20" rx="10" fill="#fff"/><text x="1517" y="664" fill="#4c7457" font-size="10" font-weight="700">SAVE · PDF</text>
  </g>
  <text x="62" y="739" font-family="Segoe UI,Arial" font-size="13" fill="#718694">Retrieval-augmented here means evidence is retrieved from the uploaded syllabus before rule-based generation. It is not a hosted generative model.</text>
</svg>
