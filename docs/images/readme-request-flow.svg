<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
  <title id="title">Application request flow</title><desc id="desc">React sends an HTTP request to Express. Express validates it, coordinates Java, local JavaScript logic and PostgreSQL, then returns JSON for the interface to render.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1f7fa"/><stop offset="1" stop-color="#fff6e9"/></linearGradient><linearGradient id="ui" x2="1" y2="1"><stop stop-color="#e5f2f9"/><stop offset="1" stop-color="#f7fbfd"/></linearGradient><linearGradient id="api" x2="1" y2="1"><stop stop-color="#eaf1f7"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><linearGradient id="db" x2="1" y2="1"><stop stop-color="#f4ead8"/><stop offset="1" stop-color="#fff9ef"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#30566d" flood-opacity=".1"/></filter></defs>
  <rect width="1800" height="760" rx="30" fill="url(#bg)"/><text x="62" y="70" font-family="Segoe UI,Arial" font-size="14" font-weight="700" letter-spacing="2.4" fill="#557b92">THE REQUEST PATH</text><text x="62" y="119" font-family="Georgia,serif" font-size="35" fill="#1c4158">One action travels through the stack and returns as a screen update</text>
  <g font-family="Segoe UI,Arial" filter="url(#shadow)">
    <rect x="64" y="180" width="340" height="292" rx="23" fill="url(#ui)" stroke="#cfdfE8"/><circle cx="112" cy="230" r="24" fill="#2d78a6"/><path d="M101 219h22v24h-22zM105 224h14M105 230h14M105 236h9" fill="none" stroke="#fff" stroke-width="1.8"/><text x="152" y="228" fill="#1f4962" font-size="15" font-weight="700" letter-spacing="1.5">01 · FRONTEND</text><text x="92" y="291" fill="#214b66" font-family="Georgia,serif" font-size="26">React + Vite</text><text x="92" y="327" fill="#506b7d" font-size="15">Collects the user's choices:</text><text x="92" y="357" fill="#365d74" font-size="14">• subject, units and question source</text><text x="92" y="384" fill="#365d74" font-size="14">• marks and Bloom-level counts</text><text x="92" y="411" fill="#365d74" font-size="14">• syllabus file and paper options</text><rect x="91" y="433" width="270" height="22" rx="11" fill="#ffffff"/><text x="106" y="448" fill="#557487" font-size="11" font-weight="700">HTTP request with JSON + file data</text>
    <path d="M419 322h61m-13-13 13 13-13 13" fill="none" stroke="#84a7b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="494" y="180" width="340" height="292" rx="23" fill="url(#api)" stroke="#d8e3e9"/><circle cx="542" cy="230" r="24" fill="#557f9b"/><path d="M532 222h20v16h-20zM536 218h12M538 227h8M538 232h8" fill="none" stroke="#fff" stroke-width="1.7"/><text x="582" y="228" fill="#1f4962" font-size="15" font-weight="700" letter-spacing="1.5">02 · BACKEND</text><text x="522" y="291" fill="#214b66" font-family="Georgia,serif" font-size="26">Node + Express</text><text x="522" y="327" fill="#506b7d" font-size="15">Routes validate and coordinate:</text><text x="522" y="357" fill="#365d74" font-size="14">• request validation and errors</text><text x="522" y="384" fill="#365d74" font-size="14">• database queries and transactions</text><text x="522" y="411" fill="#365d74" font-size="14">• Java and local ML helpers</text><rect x="521" y="433" width="270" height="22" rx="11" fill="#fff"/><text x="536" y="448" fill="#557487" font-size="11" font-weight="700">REST endpoints under /api</text>
    <path d="M849 322h61m-13-13 13 13-13 13" fill="none" stroke="#84a7b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="924" y="180" width="340" height="292" rx="23" fill="url(#db)" stroke="#e8dcc5"/><circle cx="972" cy="230" r="24" fill="#a7824b"/><ellipse cx="972" cy="223" rx="10" ry="4" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M962 223v14c0 5 20 5 20 0v-14M962 230c0 5 20 5 20 0" fill="none" stroke="#fff" stroke-width="1.8"/><text x="1012" y="228" fill="#1f4962" font-size="15" font-weight="700" letter-spacing="1.4">03 · DATA &amp; LOGIC</text><text x="952" y="291" fill="#214b66" font-family="Georgia,serif" font-size="26">PostgreSQL + Java</text><text x="952" y="327" fill="#506b7d" font-size="15">The app gets reliable records:</text><text x="952" y="357" fill="#365d74" font-size="14">• subjects, bank questions, paper snapshots</text><text x="952" y="384" fill="#365d74" font-size="14">• Java plans question and mark slots</text><text x="952" y="411" fill="#365d74" font-size="14">• local retrieval grounds syllabus tasks</text><rect x="951" y="433" width="270" height="22" rx="11" fill="#fff"/><text x="966" y="448" fill="#557487" font-size="11" font-weight="700">SQL, JSON snapshots and subprocesses</text>
    <path d="M1279 322h61m-13-13 13 13-13 13" fill="none" stroke="#84a7b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1354" y="180" width="380" height="292" rx="23" fill="#fff" stroke="#d8e5eb"/><circle cx="1402" cy="230" r="24" fill="#6f9a7e"/><path d="m1392 230 7 7 14-15" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1442" y="228" fill="#1f4962" font-size="15" font-weight="700" letter-spacing="1.5">04 · RESPONSE</text><text x="1382" y="291" fill="#214b66" font-family="Georgia,serif" font-size="26">Back to the browser</text><text x="1382" y="327" fill="#506b7d" font-size="15">Express returns a JSON result.</text><text x="1382" y="357" fill="#365d74" font-size="14">React updates the preview and saved list.</text><text x="1382" y="384" fill="#365d74" font-size="14">PDF creation runs in the browser.</text><rect x="1381" y="410" width="300" height="45" rx="11" fill="#eaf4ed" stroke="#d8e7db"/><text x="1400" y="438" fill="#416b4d" font-size="13" font-weight="700">Review · edit · save · export</text>
  </g>
  <path d="M1680 508c0 70-74 102-153 102H270c-85 0-150-30-150-103" fill="none" stroke="#8baebe" stroke-width="2.5" stroke-dasharray="8 8"/><path d="m111 521 9-15 9 15" fill="none" stroke="#739aae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="642" y="581" width="520" height="47" rx="23" fill="#fff" stroke="#d8e5eb"/><text x="686" y="611" fill="#527488" font-family="Segoe UI,Arial" font-size="14" font-weight="700">JSON response carries the result back to the React view</text>
  <text x="62" y="704" fill="#718694" font-family="Segoe UI,Arial" font-size="13">The frontend never connects to PostgreSQL directly. Express is the controlled boundary between the browser and stored data.</text>
</svg>
