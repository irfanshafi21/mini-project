    <rect x="507" y="510" width="293" height="42" rx="10" fill="#fff" stroke="#dce6eb"/><text x="523" y="528" fill="#608096" font-size="8" font-weight="700" letter-spacing="1">Q 109  ·  UNIT 04</text><text x="523" y="543" fill="#294c63" font-size="10">Explain the role of a cache controller.</text>
