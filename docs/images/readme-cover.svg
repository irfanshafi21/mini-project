<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="760" viewBox="0 0 1920 760" role="img" aria-labelledby="title desc">
  <title id="title">Question Bank and Paper Generator</title>
  <desc id="desc">Academic paper workspace with question bank, Bloom level planning and a clean examination paper preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102d43"/><stop offset=".58" stop-color="#174b67"/><stop offset="1" stop-color="#286b82"/></linearGradient>
