<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Generated examination paper preview</title><desc id="desc">Vector illustration of a clean question paper with sections grouped by marks, Bloom levels beside questions and print and download actions.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf4f8"/><stop offset="1" stop-color="#fff8ed"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#254e68" flood-opacity=".1"/></filter></defs>
  <rect width="1600" height="1040" rx="30" fill="url(#bg)"/><rect x="180" y="34" width="1240" height="972" rx="18" fill="#fff" stroke="#d6e1e8" filter="url(#shadow)"/>
  <text x="245" y="96" font-family="Segoe UI,Arial" font-size="11" font-weight="700" letter-spacing="2" fill="#557991">STEP 03 / YOUR PAPER</text><text x="245" y="145" font-family="Georgia,serif" font-size="34" fill="#173a53">Question paper preview</text><text x="245" y="176" font-family="Segoe UI,Arial" font-size="14" fill="#607787">Review the paper, edit questions, or export a clean copy.</text>
  <g font-family="Segoe UI,Arial" font-weight="700" font-size="13"><rect x="850" y="111" width="112" height="45" rx="10" fill="#fff" stroke="#d7e3ec"/><text x="876" y="139" fill="#3d617d">Edit paper</text><rect x="975" y="111" width="130" height="45" rx="10" fill="#fff" stroke="#d7e3ec"/><text x="1004" y="139" fill="#3d617d">Print / PDF</text><rect x="1118" y="111" width="226" height="45" rx="10" fill="#2d78a6"/><text x="1146" y="139" fill="#fff">Download question paper</text></g>
  <rect x="236" y="211" width="1128" height="727" rx="10" fill="#fff" stroke="#dce5ec"/>
  <text x="292" y="270" font-family="Segoe UI,Arial" font-size="10" font-weight="700" letter-spacing="2" fill="#718798">EXAMINATION QUESTION PAPER</text><text x="292" y="316" font-family="Georgia,serif" font-size="31" fill="#203e56">Computer Organisation</text><text x="292" y="348" font-family="Segoe UI,Arial" font-size="14" fill="#526e82">12 questions</text><text x="1171" y="348" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#315d78">Total: 50 marks</text><path d="M292 374h1016" stroke="#d9e3e9"/>
  <rect x="292" y="402" width="1016" height="48" rx="8" fill="#eaf3fa"/><text x="313" y="432" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#285f83">SECTION A</text><text x="468" y="432" font-family="Segoe UI,Arial" font-size="14" fill="#547387">2-mark questions</text><text x="1165" y="432" font-family="Segoe UI,Arial" font-size="13" font-weight="600" fill="#547387">6 × 2 = 12 marks</text>
  <g font-family="Segoe UI,Arial" fill="#263f57"><text x="314" y="493" font-size="16">1.</text><text x="362" y="493" font-size="16">State the purpose of the instruction register during instruction execution.</text><rect x="1220" y="470" width="57" height="30" rx="15" fill="#e8f2f8"/><text x="1237" y="490" font-size="12" font-weight="700" fill="#2c6488">K1</text>
  <text x="314" y="554" font-size="16">2.</text><text x="362" y="554" font-size="16">Explain how a cache hit affects the average memory access time.</text><rect x="1220" y="531" width="57" height="30" rx="15" fill="#eef4f0"/><text x="1237" y="551" font-size="12" font-weight="700" fill="#46715c">K2</text>
  <text x="314" y="615" font-size="16">3.</text><text x="362" y="615" font-size="16">Apply the address-translation steps to the supplied page-table entry.</text><rect x="1220" y="592" width="57" height="30" rx="15" fill="#f7f0e3"/><text x="1237" y="612" font-size="12" font-weight="700" fill="#8a6a35">K3</text>
  <text x="314" y="676" font-size="16">4.</text><text x="362" y="676" font-size="16">Distinguish the roles of the MAR and MDR in a memory read.</text><rect x="1220" y="653" width="57" height="30" rx="15" fill="#f5ece9"/><text x="1237" y="673" font-size="12" font-weight="700" fill="#95644e">K4</text></g>
  <path d="M292 710h1016" stroke="#e4ebef"/>
  <rect x="292" y="735" width="1016" height="48" rx="8" fill="#eaf3fa"/><text x="313" y="765" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#285f83">SECTION B</text><text x="468" y="765" font-family="Segoe UI,Arial" font-size="14" fill="#547387">5-mark questions</text><text x="1165" y="765" font-family="Segoe UI,Arial" font-size="13" font-weight="600" fill="#547387">4 × 5 = 20 marks</text>
  <g font-family="Segoe UI,Arial" fill="#263f57"><text x="314" y="831" font-size="16">7.</text><text x="362" y="831" font-size="16">Compare write-through and write-back cache policies with one example.</text><rect x="1220" y="808" width="57" height="30" rx="15" fill="#e8f2f8"/><text x="1237" y="828" font-size="12" font-weight="700" fill="#2c6488">K4</text><text x="362" y="857" font-size="13" fill="#647a89">Retrieved context: Cache memory — write policies and update behaviour</text>
  <text x="314" y="901" font-size="16">8.</text><text x="362" y="901" font-size="16">Evaluate a cache policy against a stated performance requirement.</text><rect x="1220" y="878" width="57" height="30" rx="15" fill="#f5ece9"/><text x="1237" y="898" font-size="12" font-weight="700" fill="#95644e">K5</text></g>
  <text x="746" y="970" font-family="Segoe UI,Arial" font-size="11" font-weight="700" letter-spacing="1.4" fill="#748998">END OF QUESTION PAPER</text>
</svg>
