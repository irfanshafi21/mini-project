<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
  <title id="title">Question Bank data relationships</title><desc id="desc">Registered subjects connect to shared question and saved paper tables. PostgreSQL creates a physical list partition for each subject. Papers retain question snapshots and connect to optional reviewed examples and background-learning jobs.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1f7fa"/><stop offset="1" stop-color="#fff6e9"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#e5f2f9"/><stop offset="1" stop-color="#f8fbfd"/></linearGradient><linearGradient id="warm" x2="1" y2="1"><stop stop-color="#fff3df"/><stop offset="1" stop-color="#fffaf2"/></linearGradient><linearGradient id="green" x2="1" y2="1"><stop stop-color="#eaf3ed"/><stop offset="1" stop-color="#f8fbf8"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#30566d" flood-opacity=".08"/></filter></defs>
  <rect width="1800" height="760" rx="30" fill="url(#bg)"/><text x="62" y="70" font-family="Segoe UI,Arial" font-size="14" font-weight="700" letter-spacing="2.4" fill="#557b92">THE DATABASE MAP</text><text x="62" y="119" font-family="Georgia,serif" font-size="35" fill="#1c4158">One shared question table, durable papers and a traceable learning queue</text>
  <g font-family="Segoe UI,Arial" filter="url(#shadow)">
    <rect x="75" y="178" width="370" height="225" rx="22" fill="url(#blue)" stroke="#d7e5ec"/><rect x="75" y="178" width="370" height="47" rx="22" fill="#dcecf4"/><path d="M75 203v22h370v-22" fill="#dcecf4"/><text x="108" y="209" fill="#2d6f91" font-size="12" font-weight="700" letter-spacing="1.7">MASTER RECORD</text><text x="108" y="267" fill="#1d425a" font-family="Georgia,serif" font-size="27">subjects</text><text x="108" y="302" fill="#516d7e" font-size="14">Registered subject name · counters</text><text x="108" y="331" fill="#516d7e" font-size="14">Only explicit subject creation registers it.</text><text x="108" y="372" fill="#708592" font-size="12">Primary key: name</text>
    <rect x="532" y="178" width="510" height="225" rx="22" fill="#fff" stroke="#dce7ed"/><rect x="532" y="178" width="510" height="47" rx="22" fill="#e8f2f6"/><path d="M532 203v22h510v-22" fill="#e8f2f6"/><text x="565" y="209" fill="#2d6f91" font-size="12" font-weight="700" letter-spacing="1.7">REUSABLE QUESTION BANK</text><text x="565" y="267" fill="#1d425a" font-family="Georgia,serif" font-size="27">questions (partitioned parent)</text><text x="565" y="302" fill="#516d7e" font-size="14">Question text · topic · unit · marks · K level</text><text x="565" y="331" fill="#516d7e" font-size="14">Each subject gets a PostgreSQL LIST partition.</text><text x="565" y="372" fill="#708592" font-size="12">The app queries the shared parent table.</text>
    <rect x="1130" y="178" width="590" height="225" rx="22" fill="url(#warm)" stroke="#e8ddca"/><rect x="1130" y="178" width="590" height="47" rx="22" fill="#f5ebd9"/><path d="M1130 203v22h590v-22" fill="#f5ebd9"/><text x="1163" y="209" fill="#967747" font-size="12" font-weight="700" letter-spacing="1.7">RETRIEVABLE PAPER SNAPSHOT</text><text x="1163" y="267" fill="#1d425a" font-family="Georgia,serif" font-size="27">saved_papers</text><text x="1163" y="302" fill="#516d7e" font-size="14">Subject reference · title · full paper JSONB</text><text x="1163" y="331" fill="#516d7e" font-size="14">Stable snapshot survives later bank edits.</text><text x="1163" y="372" fill="#708592" font-size="12">Paper questions are not bank rows by default.</text>
  </g>
  <path d="M454 287h61m-13-13 13 13-13 13M1050 287h61m-13-13 13 13-13 13" fill="none" stroke="#84a7b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M716 420v65m-10-12 10 12 10-12" fill="none" stroke="#84a7b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="570" y="493" width="292" height="98" rx="18" fill="#fff" stroke="#dbe6eb"/><text x="599" y="527" fill="#557b92" font-size="11" font-weight="700" letter-spacing="1.5">PHYSICAL PARTITION</text><text x="599" y="560" fill="#1d425a" font-family="Georgia,serif" font-size="22">questions_&lt;subject&gt;_&lt;id&gt;</text><text x="599" y="578" fill="#718693" font-size="11">A real child table, managed by PostgreSQL.</text>
  <g font-family="Segoe UI,Arial" filter="url(#shadow)">
    <rect x="75" y="493" width="390" height="111" rx="18" fill="#fff" stroke="#dce7ed"/><text x="104" y="528" fill="#557b92" font-size="11" font-weight="700" letter-spacing="1.5">REUSE CONTROL</text><text x="104" y="562" fill="#1d425a" font-family="Georgia,serif" font-size="22">syllabus_history</text><text x="104" y="585" fill="#718693" font-size="12">Tracks fingerprints to control repeats.</text>
    <rect x="949" y="493" width="350" height="111" rx="18" fill="url(#green)" stroke="#dae7dd"/><text x="978" y="528" fill="#547c60" font-size="11" font-weight="700" letter-spacing="1.5">BACKGROUND LEARNING</text><text x="978" y="562" fill="#1d425a" font-family="Georgia,serif" font-size="22">automatic_learning_jobs</text><text x="978" y="585" fill="#718693" font-size="12">One durable queue entry per saved paper.</text>
    <rect x="1343" y="493" width="377" height="111" rx="18" fill="#fff" stroke="#dce7ed"/><text x="1372" y="528" fill="#557b92" font-size="11" font-weight="700" letter-spacing="1.5">MODEL AUDIT TRAIL</text><text x="1372" y="562" fill="#1d425a" font-family="Georgia,serif" font-size="22">reviewed_examples + runs</text><text x="1372" y="585" fill="#718693" font-size="12">Stores reviewed samples and training reports.</text>
  </g>
  <path d="M1314 403v62h-159v14m-10-10 10 10 10-10M1457 403v62h-137v14m-10-10 10 10 10-10" fill="none" stroke="#94b3a0" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round" stroke-linejoin="round"/><path d="M1320 604v33H116v-23m-10 10 10-10 10 10" fill="none" stroke="#9ab2bd" stroke-width="2" stroke-dasharray="7 7" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="698" fill="#718694" font-family="Segoe UI,Arial" font-size="13">Foreign keys keep relationships consistent. The `subject_storage` view lists each subject's physical questions partition.</text>
</svg>
